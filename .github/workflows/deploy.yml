name: Deploy to Lightsail

on:
    push:
        branches:
            - prod

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Create .env file
              run: |
                  echo "${{ secrets.ENV_TEXT }}" > .env
                  cp .env apps/web/.env
                  cp .env apps/api/.env

            - name: Typecheck API
              run: bun run typecheck

            - name: Build web app
              run: bun run build

            - name: Build Docker image
              run: docker build -t calendar-app:latest .

            - name: Save Docker image
              run: docker save calendar-app:latest | gzip > calendar-app.tar.gz

            - name: Create target directory
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  script: mkdir -p ~/calendar-app

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  source: calendar-app.tar.gz,compose.yml,.env
                  target: ~/calendar-app
                  timeout: 600s

            - name: Deploy
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd ~/calendar-app
                      docker load < calendar-app.tar.gz
                      docker stop calendar-app || true
                      docker rm calendar-app || true
                      docker compose up -d
                      rm calendar-app.tar.gz
